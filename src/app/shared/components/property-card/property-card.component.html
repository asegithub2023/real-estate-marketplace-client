<div class="card property-card h-100 border-0 shadow-sm">

  <div class="property-image-wrapper">

    <img
      [src]="imageUrl"
      [alt]="property.title"
      class="property-image"
    />

    <span class="badge bg-primary property-status">
      {{ property.status }}
    </span>

    <button
      type="button"
      class="btn btn-light favorite-button"
      aria-label="Add property to favorites">

      <i class="bi bi-heart"></i>

    </button>

  </div>

  <div class="card-body">

    <p class="text-primary fw-semibold mb-1">
      {{ property.price | number }}
    </p>

    <h5 class="card-title mb-2">
      {{ property.title }}
    </h5>

    <p class="text-muted mb-3">
      <i class="bi bi-geo-alt me-1"></i>
      {{ property.city }}
    </p>

    <div class="property-details">

      <span>
        <i class="bi bi-door-open me-1"></i>
        {{ property.bedrooms }} Beds
      </span>

      <span>
        <i class="bi bi-droplet me-1"></i>
        {{ property.bathrooms }} Baths
      </span>

      <span>
        <i class="bi bi-rulers me-1"></i>
        {{ property.area }} m²
      </span>

    </div>

  </div>

  <div class="card-footer bg-white border-0 px-3 pb-3">

    <a
      [routerLink]="['/properties', property.id]"
      class="btn btn-outline-primary w-100">

      View Property

      <i class="bi bi-arrow-right ms-2"></i>

    </a>

  </div>

</div>
